version: "3.8"

services:
  api:
    build:
      context: .
      target: runner
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_pass@db:5432/ecommerce_db
      - JWT_SECRET=super_secret_key_change_me_in_production
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    command: apiflask run --host=0.0.0.0 --port=5000 --reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_pass
      - POSTGRES_DB=ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ecommerce_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
